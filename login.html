<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login | SIP Wanurejo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;
            padding: 30px 15px;
            font-family: 'Segoe UI', Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #10382e,
                #17483e,
                #32765c
            );

            display: flex;
            align-items: center;
            justify-content: center;

            color: #243b35;

        }

        .wrapper {

            width: 100%;
            max-width: 430px;

        }

        .card {

            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 50px #0003;

        }

        .brand {

            text-align: center;
            margin-bottom: 30px;

        }

        .logo {

            width: 65px;
            height: 65px;
            background: #e5f0e6;
            border-radius: 16px;
            margin: 0 auto 18px;
            display: grid;
            place-items: center;
            font-size: 30px;

        }

        h1 {

            font-size: 25px;
            color: #17483e;
            margin: 0 0 8px;

        }

        .subtitle {

            color: #65776e;
            font-size: 14px;
            line-height: 1.6;
            margin: 0;

        }

        label {

            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;

        }

        .field {

            margin-bottom: 20px;

        }

        input {

            width: 100%;
            padding: 13px;
            border: 1px solid #d4dfd6;
            border-radius: 8px;
            font-size: 14px;
            background: #f8faf8;
            outline: none;

        }

        input:focus {

            border-color: #247c65;
            box-shadow: 0 0 0 3px #247c6515;

        }

        .password-box {

            position: relative;

        }

        .password-box input {

            padding-right: 100px;

        }

        .toggle {

            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #247c65;
            cursor: pointer;
            font-size: 12px;

        }

        .forgot {

            text-align: right;
            margin: -5px 0 20px;

        }

        .forgot button {

            border: none;
            background: transparent;
            color: #247c65;
            cursor: pointer;
            font-size: 13px;

        }

        .submit {

            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #17483e;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;

        }

        .submit:hover {

            background: #247c65;

        }

        button:disabled {

            opacity: 0.6;
            cursor: wait;

        }

        .register {

            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #65776e;

        }

        .register a {

            color: #247c65;
            font-weight: 700;
            text-decoration: none;

        }

        .back {

            display: block;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-top: 25px;

        }

        .message {

            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;

        }

        .message:empty {

            display: none;

        }

        .error {

            background: #fdeaea;
            color: #a52a2a;

        }

        .success {

            background: #e4f3e7;
            color: #246b37;

        }

        .footer {

            text-align: center;
            color: #c9ded1;
            font-size: 11px;
            margin-top: 20px;

        }

        @media (max-width: 450px) {

            .card {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

    <main class="wrapper">

        <div class="card">

            <div class="brand">

                <div class="logo">🗺️</div>

                <h1>SIP WANUREJO</h1>

                <p class="subtitle">

                    Sistem Informasi Pertanahan

                    <br>

                    Masuk untuk mengakses akun Anda

                </p>

            </div>

            <div id="message"
                class="message"
                role="status"></div>

            <form id="loginForm">

                <div class="field">

                    <label for="email">

                        Alamat Email

                    </label>

                    <input

                        type="email"

                        id="email"

                        placeholder="Masukkan alamat email"

                        autocomplete="email"

                        required

                    >

                </div>

                <div class="field">

                    <label for="password">

                        Kata Sandi

                    </label>

                    <div class="password-box">

                        <input

                            type="password"

                            id="password"

                            placeholder="Masukkan kata sandi"

                            autocomplete="current-password"

                            required

                        >

                        <button

                            type="button"

                            class="toggle"

                            data-toggle-password="password"

                        >

                            Lihat

                        </button>

                    </div>

                </div>

                <div class="forgot">

                    <button

                        type="button"

                        id="resetPassword"

                    >

                        Lupa kata sandi?

                    </button>

                </div>

                <button

                    type="submit"

                    class="submit"

                    id="loginButton"

                >

                    Masuk

                </button>

            </form>

            <div class="register">

                Belum memiliki akun?

                <a href="./register.html">

                    Daftar di sini

                </a>

            </div>

        </div>

        <a href="./index.html" class="back">

            ← Kembali ke Beranda

        </a>

        <div class="footer">

            SIP Wanurejo — Kelompok 4

            <br>

            Perencanaan Wilayah dan Kota

            <br>

            Universitas Diponegoro

        </div>

    </main>

    <script type="module" src="./auth.js"></script>

</body>

</html>
