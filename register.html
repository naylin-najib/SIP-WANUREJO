<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Registrasi | SIP Wanurejo</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;
            min-height: 100vh;
            padding: 30px 15px;
            font-family: 'Segoe UI', Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #10382e,
                #17483e,
                #32765c
            );

            display: flex;
            align-items: center;
            justify-content: center;

            color: #243b35;

        }

        .wrapper {

            width: 100%;
            max-width: 450px;

        }

        .card {

            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 50px #0003;

        }

        .brand {

            text-align: center;
            margin-bottom: 25px;

        }

        .logo {

            width: 60px;
            height: 60px;
            border-radius: 15px;
            background: #e5f0e6;
            display: grid;
            place-items: center;
            margin: 0 auto 15px;
            font-size: 28px;

        }

        h1 {

            font-size: 25px;
            color: #17483e;
            margin: 0 0 8px;

        }

        .subtitle {

            color: #65776e;
            font-size: 13px;
            line-height: 1.6;
            margin: 0;

        }

        .field {

            margin-bottom: 17px;

        }

        label {

            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;

        }

        input {

            width: 100%;
            padding: 12px;
            border: 1px solid #d4dfd6;
            border-radius: 8px;
            background: #f8faf8;
            font-size: 14px;
            outline: none;

        }

        input:focus {

            border-color: #247c65;
            box-shadow: 0 0 0 3px #247c6515;

        }

        .password-box {

            position: relative;

        }

        .password-box input {

            padding-right: 100px;

        }

        .toggle {

            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #247c65;
            font-size: 12px;
            cursor: pointer;

        }

        .hint {

            display: block;
            font-size: 11px;
            color: #65776e;
            margin-top: 6px;

        }

        .submit {

            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #17483e;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;

        }

        .submit:hover {

            background: #247c65;

        }

        button:disabled {

            opacity: 0.6;
            cursor: wait;

        }

        .login {

            text-align: center;
            font-size: 13px;
            color: #65776e;
            margin-top: 22px;

        }

        .login a {

            color: #247c65;
            font-weight: 700;
            text-decoration: none;

        }

        .back {

            display: block;
            text-align: center;
            color: white;
            text-decoration: none;
            font-size: 14px;
            margin-top: 22px;

        }

        .message {

            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.5;

        }

        .message:empty {

            display: none;

        }

        .error {

            background: #fdeaea;
            color: #a52a2a;

        }

        .success {

            background: #e4f3e7;
            color: #246b37;

        }

        .footer {

            text-align: center;
            color: #c9ded1;
            font-size: 11px;
            margin-top: 18px;

        }

        @media (max-width: 450px) {

            .card {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

    <main class="wrapper">

        <div class="card">

            <div class="brand">

                <div class="logo">👤</div>

                <h1>Daftar Akun</h1>

                <p class="subtitle">

                    Bergabung dengan Sistem Informasi

                    <br>

                    Pertanahan Wanurejo

                </p>

            </div>

            <div id="message"
                class="message"
                role="status"></div>

            <form id="registerForm">

                <!-- NAMA LENGKAP -->

                <div class="field">

                    <label for="name">

                        Nama Lengkap

                    </label>

                    <input

                        type="text"

                        id="name"

                        placeholder="Masukkan nama lengkap"

                        autocomplete="name"

                        required

                    >

                </div>


                <!-- EMAIL -->

                <div class="field">

                    <label for="email">

                        Alamat Email

                    </label>

                    <input

                        type="email"

                        id="email"

                        placeholder="Masukkan alamat email"

                        autocomplete="email"

                        required

                    >

                </div>


                <!-- PASSWORD -->

                <div class="field">

                    <label for="password">

                        Kata Sandi

                    </label>

                    <div class="password-box">

                        <input

                            type="password"

                            id="password"

                            placeholder="Buat kata sandi"

                            autocomplete="new-password"

                            minlength="6"

                            required

                        >

                        <button

                            type="button"

                            class="toggle"

                            data-toggle-password="password"

                        >

                            Lihat

                        </button>

                    </div>

                    <small class="hint">

                        Minimal 6 karakter.

                    </small>

                </div>


                <!-- KONFIRMASI PASSWORD -->

                <div class="field">

                    <label for="confirmPassword">

                        Konfirmasi Kata Sandi

                    </label>

                    <div class="password-box">

                        <input

                            type="password"

                            id="confirmPassword"

                            placeholder="Ulangi kata sandi"

                            autocomplete="new-password"

                            required

                        >

                        <button

                            type="button"

                            class="toggle"

                            data-toggle-password="confirmPassword"

                        >

                            Lihat

                        </button>

                    </div>

                </div>


                <!-- TOMBOL REGISTRASI -->

                <button

                    type="submit"

                    class="submit"

                    id="registerButton"

                >

                    Daftar Sekarang

                </button>

            </form>

            <div class="login">

                Sudah memiliki akun?

                <a href="./login.html">

                    Masuk di sini

                </a>

            </div>

        </div>

        <a href="./index.html" class="back">

            ← Kembali ke Beranda

        </a>

        <div class="footer">

            SIP Wanurejo — Kelompok 4

            <br>

            Perencanaan Wilayah dan Kota

            <br>

            Universitas Diponegoro

        </div>

    </main>

    <script type="module" src="./auth.js"></script>

</body>

</html>
